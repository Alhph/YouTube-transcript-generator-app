<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>YouTube Transcript Generator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f9f9f9;
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }

    h2 {
      text-align: center;
      color: #333;
    }

    input, select, button {
      padding: 12px;
      width: 100%;
      margin-top: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      background: #4CAF50;
      color: white;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #45a049;
    }

    #copyBtn, #downloadBtn {
      width: 48%;
      display: none;
      margin-top: 10px;
    }

    .button-row {
      display: flex;
      gap: 4%;
      justify-content: space-between;
    }

    pre {
      white-space: pre-wrap;
      background: #fff;
      padding: 16px;
      border-radius: 8px;
      margin-top: 20px;
      border: 1px solid #ddd;
      color: #333;
      max-height: 400px;
      overflow-y: auto;
    }

    .loading { color: #007BFF; font-weight: bold; }
    .error { color: red; font-weight: bold; }
  </style>
</head>

  <input type="text" id="ytUrl" placeholder="Paste YouTube URL here" />
  <select id="language">
    <option value="en">English</option>
    <option value="es">Spanish</option>
    <option value="fr">French</option>
    <option value="de">German</option>
    <option value="pt">Portuguese</option>
    <option value="id">Indonesian</option>
    <option value="sw">Swahili</option>
  </select>
  <button onclick="getTranscript()">Get Transcript</button>
  
  <div class="button-row">
    <button id="copyBtn" onclick="copyTranscript()">Copy Transcript</button>
    <button id="downloadBtn" onclick="downloadTranscript()">Download Transcript</button>
  </div>

  <pre id="result"></pre>
