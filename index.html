<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YouTube Transcript Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f9fc;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
    }

    h1 {
      color: #222;
    }

    input {
      padding: 10px;
      width: 300px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 20px;
    }

    button {
      padding: 10px 20px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background-color: #007bff;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    #transcript {
      margin-top: 20px;
      max-width: 700px;
      text-align: left;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    #downloadBtn {
      display: none;
      background-color: #28a745;
    }

    #downloadBtn:hover {
      background-color: #1c7d35;
    }
  </style>
</head>
<body>
  <h1>YouTube Transcript Generator</h1>
  <input type="text" id="urlInput" placeholder="Enter YouTube video URL" />
  <button onclick="generateTranscript()">Generate Transcript</button>
  <button id="downloadBtn" onclick="downloadTranscript()">Download Transcript</button>
  <div id="transcript"></div>

  <script>
    async function generateTranscript() {
      const url = document.getElementById("urlInput").value;
      const response = await fetch("/transcript", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: url })
      });

      const data = await response.json();
      const transcriptDiv = document.getElementById("transcript");
      const downloadBtn = document.getElementById("downloadBtn");

      if (data.transcript) {
        transcriptDiv.textContent = data.transcript;
        downloadBtn.style.display = "inline-block";
      } else {
        transcriptDiv.textContent = data.error || "Something went wrong.";
        downloadBtn.style.display = "none";
      }
    }

    function downloadTranscript() {
      const text = document.getElementById("transcript").textContent;
      const blob = new Blob([text], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "transcript.txt";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
